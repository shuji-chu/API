<svg class="nav-icon" onclick="openSearch()" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<img src="logo.jpg" class="avatar" onclick="toggleProfileMenu(event)">
<span class="icon">☰</span>
</div>

<div class="profile-menu" id="profileMenu">
<div class="profile-header"><img src="logo.jpg" class="profile-avatar"><div><div class="profile-name">shujichu</div><div class="profile-status">已登录</div></div></div>
<a href="dashboard.html" class="profile-item">🖥️ 控制台</a>

<main class="container">
<div class="card">
<div class="card-label" id="category-label"></div>
<h1 class="card-title" id="category-title"></h1>
<p class="card-desc" id="category-desc"></p>
<div class="api-list" id="api-list"></div>
<a href="index.html" class="back-link">← 返回分类</a>
</div>
</main>

<script src="data.js"></script>
<script src="data-draw.js"></script>
<script>
const categoryInfo = {
  query:   { name: '查询类', desc: '各类信息查询服务' },
  service: { name: '服务类', desc: '实用工具服务' },
  draw:    { name: '绘画类', desc: 'AI绘画与视频生成' },
  sms:     { name: '接码类', desc: '短信验证码接收' },
  free:    { name: '免费类', desc: '免费接口集合' }
};
const params = new URLSearchParams(window.location.search);
const type = params.get('type') || 'query';
const info = categoryInfo[type] || categoryInfo.query;
const apis = allApis[type] || [];
document.title = info.name + ' - SAFW AI';
document.getElementById('category-label').textContent = info.name;
document.getElementById('category-title').textContent = info.name + ' API';
document.getElementById('category-desc').textContent = info.desc;
const listEl = document.getElementById('api-list');
if (apis.length === 0) {
  listEl.innerHTML = '<p style="color:#64748b; text-align:center; padding:20px;">暂无接口</p>';
} else {
  listEl.innerHTML = apis.map(api => {
    const priceText = api.price !== undefined
      ? (api.price === 0 ? '免费' : api.price + ' USDT/次')
      : '按量计费';
    return `
      <a href="doc.html?id=${api.id}" class="api-item" style="text-decoration:none; display:block;">
        <div class="api-item-name">${api.name}</div>
        <div class="api-item-desc">${api.desc}</div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div class="api-item-path">${api.endpoint}</div>
          <div style="font-size:12px; color:#2563eb; font-weight:700;">${priceText}</div>
        </div>
      </a>`;
  }).join('');
}
</script>
<script src="script.js"></script>
</body>
</html>
