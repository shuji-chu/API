<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>价格 - SAFW AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
                <img src="logo.jpg" alt="Logo" class="nav-logo">
                <span class="nav-title">SAFW AI</span>
            </a>
        </div>
        <div class="nav-right">
            <span class="icon">🔍</span>
            <img src="logo.jpg" alt="Avatar" class="avatar" onclick="toggleProfileMenu(event)">
            <span class="icon">☰</span>
        </div>
    </nav>

    <div class="profile-menu" id="profileMenu">
        <div class="profile-header">
            <img src="logo.jpg" alt="Avatar" class="profile-avatar">
            <div>
                <div class="profile-name">shujichu</div>
                <div class="profile-status">已登录</div>
            </div>
        </div>
        <a href="dashboard.html" class="profile-item"><span>🖥️</span> 控制台</a>
        <a href="pricing.html" class="profile-item"><span>💰</span> 价格</a>
        <div class="profile-item" onclick="toggleDarkMode()"><span>🌙</span> 切换深色模式</div>
        <div class="profile-item" onclick="copyMyId()"><span>📋</span> 复制我的 ID</div>
        <div class="profile-divider"></div>
        <div class="profile-item logout" onclick="logout()"><span>🚪</span> 退出登录</div>
    </div>

    <div class="tabs">
        <a href="index.html" class="tab">API 列表</a>
        <a href="dashboard.html" class="tab">控制台</a>
        <a href="pricing.html" class="tab active">价格</a>
        <span class="tab">更新日志</span>
        <span class="tab">每日热搜</span>
    </div>

    <main class="container">
        <div class="card">
            <div class="card-label">价格方案</div>
            <h1 class="card-title">按量付费，透明公开</h1>
            <p class="card-desc">所有接口均按调用次数计费，无最低消费，充值即用。</p>
            <div class="pricing-grid">
                <div class="pricing-item">
                    <div class="pricing-name">基础版</div>
                    <div class="pricing-price">¥0.01 <span class="pricing-unit">/次</span></div>
                    <ul class="pricing-features">
                        <li>基础接口调用</li>
                        <li>标准响应速度</li>
                        <li>社区支持</li>
                    </ul>
                    <button class="try-btn" style="margin-top: 20px;" onclick="showToast('需接入后端支付系统', 'info')">立即充值</button>
                </div>
                <div class="pricing-item featured">
                    <div class="pricing-badge">推荐</div>
                    <div class="pricing-name">专业版</div>
                    <div class="pricing-price">¥0.005 <span class="pricing-unit">/次</span></div>
                    <ul class="pricing-features">
                        <li>全部高级接口</li>
                        <li>更快的响应速度</li>
                        <li>专属技术群</li>
                    </ul>
                    <button class="try-btn" style="margin-top: 20px;" onclick="showToast('需接入后端支付系统', 'info')">立即充值</button>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
