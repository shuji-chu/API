<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - SAFW AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
                <img src="logo.jpg" alt="Logo" class="nav-logo">
                <span class="nav-title">SAFW AI</span>
            </a>
        </div>
        <div class="nav-right">
            <span class="icon">🔍</span>
            <img src="logo.jpg" alt="Avatar" class="avatar" onclick="toggleProfileMenu(event)">
            <span class="icon">☰</span>
        </div>
    </nav>

    <div class="profile-menu" id="profileMenu">
        <div class="profile-header">
            <img src="logo.jpg" alt="Avatar" class="profile-avatar">
            <div>
                <div class="profile-name">shujichu</div>
                <div class="profile-status">已登录</div>
            </div>
        </div>
        <a href="dashboard.html" class="profile-item"><span>🖥️</span> 控制台</a>
        <a href="pricing.html" class="profile-item"><span>💰</span> 价格</a>
        <div class="profile-item" onclick="toggleDarkMode()"><span>🌙</span> 切换深色模式</div>
        <div class="profile-item" onclick="copyMyId()"><span>📋</span> 复制我的 ID</div>
        <div class="profile-divider"></div>
        <div class="profile-item logout" onclick="logout()"><span>🚪</span> 退出登录</div>
    </div>

    <div class="tabs">
        <a href="index.html" class="tab">API 列表</a>
        <a href="dashboard.html" class="tab active">控制台</a>
        <a href="pricing.html" class="tab">价格</a>
        <a href="log.html" class="tab">更新日志</a>
        <a href="hot.html" class="tab">每日热搜</a>
    </div>

    <main class="container">
        <div class="card">
            <div class="card-label">控制台</div>
            <h1 class="card-title">账户概览</h1>
            <p class="card-desc">查看你的账户余额、API 调用情况。</p>
            <div class="dashboard-stats">
                <div class="stat-box">
                    <div class="stat-label">当前余额</div>
                    <div class="stat-value">¥ 0.00</div>
                    <a href="pricing.html" class="stat-link">去充值 →</a>
                </div>
                <div class="stat-box">
                    <div class="stat-label">今日调用</div>
                    <div class="stat-value">0 次</div>
                </div>
            </div>
            <h3 class="section-title" style="margin-top: 24px;">我的 API 密钥</h3>
            <div class="endpoint-box" style="display:flex; justify-content:space-between; align-items:center;">
                <div class="endpoint-path" style="margin:0;">sk-xxxxxxxxxxxxxxxx</div>
                <button class="try-btn" style="width:auto; padding:8px 16px; font-size:14px;" onclick="copyText('sk-xxxxxxxxxxxxxxxx')">复制</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
